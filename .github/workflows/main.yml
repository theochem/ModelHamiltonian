# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: [3.10.12]

    steps:
    - uses: actions/checkout@v2
    - name: Additional info about the build
      shell: bash
      run: |
        uname -a
        df -h
        ulimit -a
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install -r requirements.txt
        python -m pip install -U pytest pydocstyle pycodestyle
    - name: Install package
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install .
    - name: Check built wheel
      shell: bash
      run: |
        wheel_dir="$(mktemp -d)"
        install_dir="$(mktemp -d)"
        smoke_dir="$(mktemp -d)"
        python -m pip wheel . --no-deps --wheel-dir "$wheel_dir"
        python -m pip install --no-deps --target "$install_dir" "$wheel_dir"/moha-*.whl
        cd "$smoke_dir"
        PYTHONPATH="$install_dir" python - <<'PY'
        from pathlib import Path
        import moha

        package = Path(moha.__file__).parent
        resources = (
            "rauk/hx_dictionary.json", "rauk/kxy_matrix_1.json",
            "rauk/ionization.json", "toml_tools/defaults.toml",
            "gpt/config.toml", "gpt/tools.json",
        )
        assert all((package / resource).is_file() for resource in resources)
        PY
    - name: Run tests
      shell: bash
      run: |
        python -m pytest -v moha/test/test*
        python -m pycodestyle moha/. 
        python -m pydocstyle moha/.
